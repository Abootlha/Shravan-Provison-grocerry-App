# Builds the NestJS backend and deploys it to the VPS (PM2).
#   main    -> production  (DEPLOY_PATH,     PM2 app shravan-backend)
#   develop -> development (DEPLOY_PATH_DEV, PM2 app shravan-backend-dev)
# Both targets live on the same server. Server setup, secrets and rollback:
# docs/DEPLOYMENT.md
name: Deploy backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy (or roll back).'
        required: true
        default: production
        type: choice
        options:
          - production
          - development
      ref:
        description: 'Git ref (branch, tag or commit SHA) to deploy. Empty = the branch selected above.'
        required: false
        default: ''
        type: string
      rollback:
        description: 'Do not build: switch the server back to the previous release.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    outputs:
      sha: ${{ steps.package.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci

      - name: Build
        run: npm run build

      # Runtime files only: no .env, node_modules, sources or tests. Production
      # dependencies (including native ones like sharp and bcrypt) are installed
      # on the server so they match its platform.
      - name: Package release
        id: package
        run: |
          sha="$(git rev-parse HEAD)"
          printf '%s\n' "$sha" > REVISION
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            dist package.json package-lock.json .nvmrc ecosystem.config.js \
            scripts create-admin.js REVISION
          rm REVISION
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/release.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to ${{ (github.event_name == 'workflow_dispatch' && inputs.target) || (github.ref == 'refs/heads/develop' && 'development') || 'production' }}
    needs: verify
    # Runs after a successful verify, or alone for a rollback (verify skipped).
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (inputs.rollback && needs.verify.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # push to main -> production, push to develop -> development,
    # workflow_dispatch -> the `target` input.
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.target) || (github.ref == 'refs/heads/develop' && 'development') || 'production' }}
    concurrency:
      group: deploy-backend-${{ (github.event_name == 'workflow_dispatch' && inputs.target) || (github.ref == 'refs/heads/develop' && 'development') || 'production' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ (github.event_name == 'workflow_dispatch' && inputs.target) || (github.ref == 'refs/heads/develop' && 'development') || 'production' }}
      # Same server, user and key for both targets.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      # Per-target settings; the "Select target" step picks one set.
      PROD_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/var/www/shravan-backend' }}
      PROD_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL || vars.DEPLOY_HEALTHCHECK_URL }}
      PROD_PUBLIC_HEALTHCHECK_URL: ${{ secrets.PUBLIC_HEALTHCHECK_URL || vars.PUBLIC_HEALTHCHECK_URL }}
      DEV_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_DEV || vars.DEPLOY_PATH_DEV }}
      DEV_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL_DEV || vars.DEPLOY_HEALTHCHECK_URL_DEV }}
      DEV_PUBLIC_HEALTHCHECK_URL: ${{ secrets.PUBLIC_HEALTHCHECK_URL_DEV || vars.PUBLIC_HEALTHCHECK_URL_DEV }}
      MODE: ${{ inputs.rollback && 'rollback' || 'deploy' }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      # Sets DEPLOY_PATH, APP_NAME and the health check URLs for this target.
      # The development target never falls back to production values.
      - name: Select target
        run: |
          case "$TARGET" in
            production)
              deploy_path="$PROD_DEPLOY_PATH"
              app_name=shravan-backend
              health="$PROD_HEALTHCHECK_URL"
              public_health="$PROD_PUBLIC_HEALTHCHECK_URL"
              ;;
            development)
              deploy_path="$DEV_DEPLOY_PATH"
              app_name=shravan-backend-dev
              health="$DEV_HEALTHCHECK_URL"
              public_health="$DEV_PUBLIC_HEALTHCHECK_URL"
              if [ -z "$deploy_path" ]; then
                echo "::error::DEPLOY_PATH_DEV secret/variable is not set (see docs/DEPLOYMENT.md)"
                exit 1
              fi
              if [ "${deploy_path%/}" = "${PROD_DEPLOY_PATH%/}" ]; then
                echo "::error::DEPLOY_PATH_DEV must differ from the production DEPLOY_PATH"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown target: $TARGET"
              exit 1
              ;;
          esac
          {
            echo "DEPLOY_PATH=$deploy_path"
            echo "APP_NAME=$app_name"
            echo "DEPLOY_HEALTHCHECK_URL=$health"
            echo "PUBLIC_HEALTHCHECK_URL=$public_health"
          } >> "$GITHUB_ENV"
          echo "Target: $TARGET (PM2 app $app_name)"

      # The deploy script always comes from this run's checkout (for a rollback:
      # the branch the workflow was dispatched on).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: backend/scripts/deploy

      - name: Download release
        if: env.MODE == 'deploy'
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: ${{ runner.temp }}/release

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing (see docs/DEPLOYMENT.md)"
            exit 1
          fi
          echo "::add-mask::$DEPLOY_PATH"

          umask 077
          dir="$RUNNER_TEMP/ssh"
          mkdir -p "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          cat > "$dir/config" <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile $dir/key
            IdentitiesOnly yes
            UserKnownHostsFile $dir/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
            LogLevel ERROR
          EOF
          chmod 600 "$dir/key" "$dir/known_hosts" "$dir/config"
          echo "SSH_CONFIG=$dir/config" >> "$GITHUB_ENV"

      - name: Upload release
        run: |
          incoming="$DEPLOY_PATH/incoming"
          ssh -F "$SSH_CONFIG" deploy-target "mkdir -p $(printf '%q' "$incoming")"
          files=(backend/scripts/deploy/remote-deploy.sh)
          if [ "$MODE" = deploy ]; then
            files+=("$RUNNER_TEMP/release/release.tar.gz")
          fi
          scp -F "$SSH_CONFIG" -q "${files[@]}" "deploy-target:$(printf '%q' "$incoming")/"

      - name: Run remote ${{ env.MODE }}
        run: |
          incoming="$DEPLOY_PATH/incoming"
          cmd="DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") APP_NAME=$(printf '%q' "$APP_NAME")"
          if [ -n "$DEPLOY_HEALTHCHECK_URL" ]; then
            cmd="$cmd HEALTHCHECK_URL=$(printf '%q' "$DEPLOY_HEALTHCHECK_URL")"
          fi
          cmd="$cmd bash $(printf '%q' "$incoming/remote-deploy.sh") $MODE"
          if [ "$MODE" = deploy ]; then
            cmd="$cmd $(printf '%q' "$incoming/release.tar.gz") $(printf '%q' "$SHA")"
          fi
          ssh -F "$SSH_CONFIG" deploy-target "$cmd"

      - name: Report deployed commit
        run: |
          deployed="$(ssh -F "$SSH_CONFIG" deploy-target "cat $(printf '%q' "$DEPLOY_PATH/DEPLOYED_SHA")")"
          echo "Deployed commit: $deployed"
          {
            echo "### Backend ${MODE} to ${TARGET} succeeded"
            echo ""
            echo "Live commit: \`$deployed\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Through Cloudflare and nginx. Failing here does not roll back: the app
      # was healthy on the server, so the problem is in front of it.
      - name: Public health check
        if: env.PUBLIC_HEALTHCHECK_URL != ''
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 -o /dev/null "$PUBLIC_HEALTHCHECK_URL"; then
              echo "Public health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Public health check failed (app is healthy on the server; check nginx/Cloudflare)"
          exit 1

      - name: Clean up
        if: always()
        run: |
          if [ -n "${SSH_CONFIG:-}" ]; then
            ssh -F "$SSH_CONFIG" deploy-target "rm -f $(printf '%q' "$DEPLOY_PATH/incoming/release.tar.gz")" || true
          fi
          rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/release"
