name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Same as `npm run lint` but without --fix, so CI fails instead of rewriting.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci

      - name: Build
        run: npx nest build

  admin:
    name: Admin (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      - name: Tests
        run: npx vitest run

      # Production builds require the API URLs; CI only checks that the site builds.
      - name: Build
        run: npm run build
        env:
          PUBLIC_API_URL: https://api.example.invalid/api/v1
          PUBLIC_TRACKING_URL: https://api.example.invalid/tracking

  rider-app:
    name: Rider app (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/rider-app/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  customer-app:
    name: Customer app (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: customer-app/package-lock.json

      - run: npm ci

      # No ESLint config in customer-app yet; resolving the Expo config at least
      # catches broken app.config.js / app.json and missing plugins.
      - name: Expo config sanity check
        run: npx expo config --type public > /dev/null

  backend-image:
    name: Backend image (ghcr.io)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, admin, rider-app, customer-app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # deploy:
