version: '3.8'

networks:
  shravankirana-network:
    driver: bridge

volumes:
  rabbitmq_data:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data:
  nginx_logs:

services:
  # Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: shravankirana-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - shravankirana-network
    restart: unless-stopped

  # Cache Layer
  redis:
    image: redis:7-alpine
    container_name: shravankirana-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - shravankirana-network
    restart: unless-stopped

  # MongoDB (Local Development Only - Use Atlas for Production)
  mongodb:
    image: mongo:7
    container_name: shravankirana-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: shravankirana
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shravankirana-network
    restart: unless-stopped
    profiles:
      - local-dev

  # Authentication Service
  auth-svc:
    build:
      context: ../services/auth-svc
      dockerfile: Dockerfile
    container_name: shravankirana-auth-svc
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8001
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/shravankirana?authSource=admin}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - API_GATEWAY_URL=http://nginx:80
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

  # User Service
  user-svc:
    build:
      context: ../services/user-svc
      dockerfile: Dockerfile
    container_name: shravankirana-user-svc
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8002
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/shravankirana?authSource=admin}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - AUTH_SVC_URL=http://auth-svc:8001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Rider Service
  rider-svc:
    build:
      context: ../services/rider-svc
      dockerfile: Dockerfile
    container_name: shravankirana-rider-svc
    ports:
      - "8003:8003"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8003
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/shravankirana?authSource=admin}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - AUTH_SVC_URL=http://auth-svc:8001
      - LOCATION_SVC_URL=http://location-svc:8009
      - MAPMYINDIA_API_KEY=${MAPMYINDIA_API_KEY:-your-mapmyindia-api-key}
      - MAPMYINDIA_CLIENT_ID=${MAPMYINDIA_CLIENT_ID:-your-mapmyindia-client-id}
      - MAPMYINDIA_CLIENT_SECRET=${MAPMYINDIA_CLIENT_SECRET:-your-mapmyindia-client-secret}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Order Service
  order-svc:
    build:
      context: ../services/order-svc
      dockerfile: Dockerfile
    container_name: shravankirana-order-svc
    ports:
      - "8004:8004"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8004
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/shravankirana?authSource=admin}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - AUTH_SVC_URL=http://auth-svc:8001
      - USER_SVC_URL=http://user-svc:8002
      - RIDER_SVC_URL=http://rider-svc:8003
      - PRODUCT_SVC_URL=http://product-svc:8005
      - PAYMENT_SVC_URL=http://payment-svc:8007
      - NOTIFICATION_SVC_URL=http://notification-svc:8008
      - LOCATION_SVC_URL=http://location-svc:8009
      - TRACKING_GW_URL=http://tracking-gw:8010
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Product Service
  product-svc:
    build:
      context: ../services/product-svc
      dockerfile: Dockerfile
    container_name: shravankirana-product-svc
    ports:
      - "8005:8005"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8005
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/shravankirana?authSource=admin}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - AUTH_SVC_URL=http://auth-svc:8001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Cart Service
  cart-svc:
    build:
      context: ../services/cart-svc
      dockerfile: Dockerfile
    container_name: shravankirana-cart-svc
    ports:
      - "8006:8006"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8006
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - AUTH_SVC_URL=http://auth-svc:8001
      - PRODUCT_SVC_URL=http://product-svc:8005
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Payment Service
  payment-svc:
    build:
      context: ../services/payment-svc
      dockerfile: Dockerfile
    container_name: shravankirana-payment-svc
    ports:
      - "8007:8007"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8007
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/shravankirana?authSource=admin}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - AUTH_SVC_URL=http://auth-svc:8001
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-your-razorpay-key-id}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-your-razorpay-key-secret}
      - PAYMENT_GATEWAY_WEBHOOK_SECRET=${PAYMENT_GATEWAY_WEBHOOK_SECRET:-your-webhook-secret}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Notification Service
  notification-svc:
    build:
      context: ../services/notification-svc
      dockerfile: Dockerfile
    container_name: shravankirana-notification-svc
    ports:
      - "8008:8008"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8008
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/shravankirana?authSource=admin}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - AUTH_SVC_URL=http://auth-svc:8001
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-your-twilio-account-sid}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-your-twilio-auth-token}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-your-twilio-phone-number}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-smtp.gmail.com}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER:-your-email@gmail.com}
      - EMAIL_SMTP_PASS=${EMAIL_SMTP_PASS:-your-email-app-password}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-your-fcm-server-key}
      - TWO_FACTOR_API_KEY=${TWO_FACTOR_API_KEY:-your-2factor-api-key}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Location Service
  location-svc:
    build:
      context: ../services/location-svc
      dockerfile: Dockerfile
    container_name: shravankirana-location-svc
    ports:
      - "8009:8009"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8009
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/shravankirana?authSource=admin}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - AUTH_SVC_URL=http://auth-svc:8001
      - MAPMYINDIA_API_KEY=${MAPMYINDIA_API_KEY:-your-mapmyindia-api-key}
      - MAPMYINDIA_CLIENT_ID=${MAPMYINDIA_CLIENT_ID:-your-mapmyindia-client-id}
      - MAPMYINDIA_CLIENT_SECRET=${MAPMYINDIA_CLIENT_SECRET:-your-mapmyindia-client-secret}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Tracking Gateway
  tracking-gw:
    build:
      context: ../services/tracking-gw
      dockerfile: Dockerfile
    container_name: shravankirana-tracking-gw
    ports:
      - "8010:8010"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8010
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - LOCATION_SVC_URL=http://location-svc:8009
      - ORDER_SVC_URL=http://order-svc:8004
      - TRACKING_GATEWAY_SECRET=${TRACKING_GATEWAY_SECRET:-tracking-gateway-secret-change-in-prod}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Analytics Service
  analytics-svc:
    build:
      context: ../services/analytics-svc
      dockerfile: Dockerfile
    container_name: shravankirana-analytics-svc
    ports:
      - "8011:8011"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8011
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/shravankirana?authSource=admin}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      - AUTH_SVC_URL=http://auth-svc:8001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: shravankirana-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etcrometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - shravankirana-network
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:10.0.0
    container_name: shravankirana-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-explorer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Reverse Proxy - Nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: shravankirana-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - shravankirana-network
    restart: unless-stopped
    depends_on:
      - auth-svc
      - user-svc
      - rider-svc
      - order-svc
      - product-svc
      - cart-svc
      - payment-svc
      - notification-svc
      - location-svc
      - tracking-gw
      - analytics-svc
