version: '3.8'

services:
  auth-svc:
    build:
      context: ../../services/auth-svc
      target: builder
    volumes:
      - ../../services/auth-svc/src:/app/src
      - ../../services/auth-svc/src:/app/src:ro
    ports:
      - "3001:3001"
      - "3002:3002"
      - "9229:9229"
    command: ["node", "--watch", "dist/main.js"]
    environment:
      - NODE_ENV=development
      - DEBUG=*
    restart: unless-stopped

  user-svc:
