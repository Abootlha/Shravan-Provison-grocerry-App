worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream definitions
    upstream auth_svc {
        least_conn;
        server auth-svc:8001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream user_svc {
        least_conn;
        server user-svc:8002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream rider_svc {
        least_conn;
        server rider-svc:8003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream order_svc {
        least_conn;
        server order-svc:8004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream product_svc {
        least_conn;
        server product-svc:8005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream cart_svc {
        least_conn;
        server cart-svc:8006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream payment_svc {
        least_conn;
        server payment-svc:8007 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream notification_svc {
        least_conn;
        server notification-svc:8008 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream location_svc {
        least_conn;
        server location-svc:8009 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream tracking_gw {
        least_conn;
        server tracking-gw:8010 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream analytics_svc {
        least_conn;
        server analytics-svc:8011 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream grafana_svc {
        server grafana:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # HTTP Server
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # CORS preflight handler
        location /api/ {
            # CORS headers
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 1728000 always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "$http_origin" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 1728000 always;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }

            # Rate limiting
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn addr 100;

            # Proxy to auth service
            if ($request_uri ~* ^/api/auth) {
                proxy_pass http://auth_svc;
                break;
            }

            # Proxy to user service
            if ($request_uri ~* ^/api/users) {
                proxy_pass http://user_svc;
                break;
            }

            # Proxy to rider service
            if ($request_uri ~* ^/api/riders) {
                proxy_pass http://rider_svc;
                break;
            }

            # Proxy to order service
            if ($request_uri ~* ^/api/orders) {
                proxy_pass http://order_svc;
                break;
            }

            # Proxy to product service
            if ($request_uri ~* ^/api/products) {
                proxy_pass http://product_svc;
                break;
            }

            # Proxy to cart service
            if ($request_uri ~* ^/api/cart) {
                proxy_pass http://cart_svc;
                break;
            }

            # Proxy to payment service
            if ($request_uri ~* ^/api/payments) {
                limit_req zone=payment_limit burst=10 nodelay;
                proxy_pass http://payment_svc;
                break;
            }

            # Proxy to notification service
            if ($request_uri ~* ^/api/notifications) {
                proxy_pass http://notification_svc;
                break;
            }

            # Proxy to location service
            if ($request_uri ~* ^/api/locations) {
                proxy_pass http://location_svc;
                break;
            }

            # Proxy to analytics service
            if ($request_uri ~* ^/api/analytics) {
                proxy_pass http://analytics_svc;
                break;
            }

            # Default - no service matched
            return 404;
        }

        # WebSocket support for tracking gateway
        location /ws/tracking {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://tracking_gw;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Socket.io for real-time tracking
        location /socket.io/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://tracking_gw;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        # Grafana proxy
        location /grafana/ {
            proxy_pass http://grafana_svc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus metrics endpoint (internal)
        location /metrics {
            auth_basic off;
            proxy_pass http://prometheus:9090;
            proxy_set_header Host $host;
        }
    }

    # HTTPS Server (SSL Configuration Placeholder)
    # Uncomment and configure for production
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name api.shravankirana.com;
    #
    #     # SSL Certificate ( Let's Encrypt recommended )
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #
    #     # SSL Configuration
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # OCSP Stapling
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     resolver 8.8.8.8 8.8.4.4 valid=300s;
    #     resolver_timeout 5s;
    #
    #     # Copy all HTTP server configurations here and modify as needed
    # }
}
