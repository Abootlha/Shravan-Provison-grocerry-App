syntax = "proto3";

package rider;

service RiderService {
  rpc Create (CreateRiderRequest) returns (RiderResponse);
  rpc FindById (FindByIdRequest) returns (RiderResponse);
  rpc FindByUserId (FindByUserIdRequest) returns (RiderResponse);
  rpc UpdateLocation (UpdateLocationRequest) returns (LocationUpdateResponse);
  rpc ToggleAvailability (ToggleAvailabilityRequest) returns (RiderResponse);
  rpc FindNearby (FindNearbyRequest) returns (NearbyRidersResponse);
  rpc GetMetrics (GetMetricsRequest) returns (MetricsResponse);
}

message CreateRiderRequest {
  string userId = 1;
  string vehicleType = 2;
}

message FindByIdRequest {
  string id = 1;
}

message FindByUserIdRequest {
  string userId = 1;
}

message UpdateLocationRequest {
  string id = 1;
  LocationData location = 2;
}

message LocationData {
  double longitude = 1;
  double latitude = 2;
  double heading = 3;
  double speed = 4;
}

message ToggleAvailabilityRequest {
  string id = 1;
  AvailabilityData availability = 2;
}

message AvailabilityData {
  bool isAvailable = 1;
  bool isOnline = 2;
}

message FindNearbyRequest {
  double longitude = 1;
  double latitude = 2;
  double radiusInMeters = 3;
  int32 limit = 4;
  bool availableOnly = 5;
  bool onlineOnly = 6;
}

message GetMetricsRequest {
  string id = 1;
}

message GeoPoint {
  string type = 1;
  repeated double coordinates = 2;
}

message RiderStats {
  int32 totalDeliveries = 1;
  double avgRating = 2;
  double acceptanceRate = 3;
}

message RiderResponse {
  string id = 1;
  string userId = 2;
  GeoPoint currentLocation = 3;
  string lastLocationUpdate = 4;
  double heading = 5;
  double speed = 6;
  bool isAvailable = 7;
  bool isOnline = 8;
  RiderStats stats = 9;
  string vehicleType = 10;
  string createdAt = 11;
  string updatedAt = 12;
}

message LocationUpdateResponse {
  bool success = 1;
  bool throttled = 2;
}

message NearbyRidersResponse {
  repeated RiderResponse riders = 1;
}

message MetricsResponse {
  int32 totalDeliveries = 1;
  double avgRating = 2;
  double acceptanceRate = 3;
  bool isOnline = 4;
  bool isAvailable = 5;
  string lastLocationUpdate = 6;
}
