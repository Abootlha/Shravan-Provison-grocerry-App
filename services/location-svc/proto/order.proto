syntax = "proto3";

package order;

import "common.proto";

message OrderItem {
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  int32 quantity = 4;
  double unit_price = 5;
  double subtotal = 6;
}

message DeliveryAddress {
  string label = 1;
  string address_line1 = 2;
  string address_line2 = 3;
  string city = 4;
  string state = 5;
  string postal_code = 6;
  string country = 7;
  common.GeoLocation location = 8;
}

message TimelineEntry {
  string status = 1;
  string message = 2;
  common.Timestamp timestamp = 3;
  string actor = 4;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_CONFIRMED = 2;
  ORDER_STATUS_PREPARING = 3;
  ORDER_STATUS_READY = 4;
  ORDER_STATUS_PICKED_UP = 5;
  ORDER_STATUS_IN_TRANSIT = 6;
  ORDER_STATUS_DELIVERED = 7;
  ORDER_STATUS_CANCELLED = 8;
  ORDER_STATUS_REFUNDED = 9;
}

message Order {
  string id = 1;
  string user_id = 2;
  string rider_id = 3;
  repeated OrderItem items = 4;
  DeliveryAddress delivery_address = 5;
  OrderStatus status = 6;
  double subtotal = 7;
  double delivery_fee = 8;
  double tax = 9;
  double total = 10;
  repeated TimelineEntry timeline = 11;
  common.Timestamp created_at = 12;
  common.Timestamp updated_at = 13;
  common.Status record_status = 14;
}

message CreateOrderRequest {
  string user_id = 1;
  repeated OrderItem items = 2;
  DeliveryAddress delivery_address = 3;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message UpdateStatusRequest {
  string order_id = 1;
  OrderStatus status = 2;
  string message = 3;
}

message UpdateStatusResponse {
  Order order = 1;
}

message AssignRiderRequest {
  string order_id = 1;
  string rider_id = 2;
}

message AssignRiderResponse {
  Order order = 1;
}

message GetOrdersRequest {
  string user_id = 1;
  OrderStatus status = 2;
  common.Pagination pagination = 3;
}

message GetOrdersResponse {
  repeated Order orders = 1;
  common.Pagination pagination = 2;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);
  rpc AssignRider(AssignRiderRequest) returns (AssignRiderResponse);
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);
}
