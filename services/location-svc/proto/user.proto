syntax = "proto3";

package user;

import "common.proto";

message User {
  string id = 1;
  string email = 2;
  string phone = 3;
  string name = 4;
  string avatar_url = 5;
  UserProfile profile = 6;
  common.Timestamp created_at = 7;
  common.Timestamp updated_at = 8;
  common.Status status = 9;
}

message UserProfile {
  string first_name = 1;
  string last_name = 2;
  string date_of_birth = 3;
  string gender = 4;
}

message Address {
  string id = 1;
  string user_id = 2;
  string label = 3;
  string address_line1 = 4;
  string address_line2 = 5;
  string city = 6;
  string state = 7;
  string postal_code = 8;
  string country = 9;
  common.GeoLocation location = 10;
  bool is_default = 11;
  common.Timestamp created_at = 12;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  string email = 2;
  string name = 3;
  UserProfile profile = 4;
}

message UpdateUserResponse {
  User user = 1;
}

message GetAddressesRequest {
  string user_id = 1;
}

message GetAddressesResponse {
  repeated Address addresses = 1;
}

message AddAddressRequest {
  string user_id = 1;
  Address address = 2;
}

message AddAddressResponse {
  Address address = 1;
}

message RemoveAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message RemoveAddressResponse {
  bool success = 1;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc GetAddresses(GetAddressesRequest) returns (GetAddressesResponse);
  rpc AddAddress(AddAddressRequest) returns (AddAddressResponse);
  rpc RemoveAddress(RemoveAddressRequest) returns (RemoveAddressResponse);
}
