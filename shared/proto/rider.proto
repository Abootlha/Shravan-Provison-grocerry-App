syntax = "proto3";

package rider;

import "common.proto";

message RiderLocation {
  string rider_id = 1;
  common.GeoLocation location = 2;
  common.Timestamp timestamp = 3;
}

message RiderProfile {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string email = 4;
  string phone = 5;
  string avatar_url = 6;
  AvailabilityStatus availability = 7;
  double rating = 8;
  int32 total_deliveries = 9;
  common.Timestamp created_at = 10;
  common.Status status = 11;
}

enum AvailabilityStatus {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_ONLINE = 1;
  AVAILABILITY_BUSY = 2;
  AVAILABILITY_OFFLINE = 3;
}

message NearbyRider {
  RiderProfile rider = 1;
  double distance_km = 2;
}

message UpdateLocationRequest {
  string rider_id = 1;
  common.GeoLocation location = 2;
}

message UpdateLocationResponse {
  bool success = 1;
}

message UpdateAvailabilityRequest {
  string rider_id = 1;
  AvailabilityStatus availability = 2;
}

message UpdateAvailabilityResponse {
  bool success = 1;
  AvailabilityStatus availability = 2;
}

message GetNearbyRidersRequest {
  common.GeoLocation location = 1;
  double radius_km = 2;
  int32 limit = 3;
}

message GetNearbyRidersResponse {
  repeated NearbyRider riders = 1;
}

message GetRiderProfileRequest {
  string rider_id = 1;
}

message GetRiderProfileResponse {
  RiderProfile rider = 1;
}

service RiderService {
  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse);
  rpc UpdateAvailability(UpdateAvailabilityRequest) returns (UpdateAvailabilityResponse);
  rpc GetNearbyRiders(GetNearbyRidersRequest) returns (GetNearbyRidersResponse);
  rpc GetRiderProfile(GetRiderProfileRequest) returns (GetRiderProfileResponse);
}
